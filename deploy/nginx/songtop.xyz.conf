server {
    listen 80;
    server_name songtop.xyz www.songtop.xyz;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name songtop.xyz www.songtop.xyz;

    ssl_certificate /data/ssl/songtop.xyz.pem;
    ssl_certificate_key /data/ssl/songtop.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 既有 resource-network 后端，保持原路由不变。
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /files/ {
        proxy_pass http://127.0.0.1:8080/files/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Training Plan 前端。构建时 Vite base 必须设为 /plan/。
    location = /plan {
        return 308 /plan/;
    }

    location ^~ /plan/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ /plan/index.html;
    }

    # Training Plan 后端。浏览器访问 /planapi/api/**，上游收到 /api/**。
    location = /planapi {
        return 308 /planapi/;
    }

    location ^~ /planapi/ {
        proxy_pass http://127.0.0.1:18080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /planapi;

        # Garmin 登录与 DeepSeek 生成可能超过 Nginx 默认的 60 秒。
        proxy_connect_timeout 10s;
        proxy_send_timeout 160s;
        proxy_read_timeout 160s;
        client_max_body_size 2m;
    }

    location / {
        root /var/www/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/songtop.xyz.access.log;
    error_log /var/log/nginx/songtop.xyz.error.log;
}
