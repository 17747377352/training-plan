server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: training-plan-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  deepseek:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    # 每用户每日真实调用上限（指纹复用的返回不计入）。0 表示不限制。
    daily-limit: ${DEEPSEEK_DAILY_LIMIT:8}
    # 前端生成请求超时 120 秒，应大于这里的读取超时。
    timeout: 90s
  sync:
    # 同步任务队列，需与 collector 的 COLLECTOR_TASK_QUEUE 一致
    task-queue: ${SYNC_TASK_QUEUE:training-plan:sync:jobs}
    # 僵死任务收敛：采集器未运行或进程消失时，任务不会有人推进
    pending-timeout: 10m
    # 大范围历史回填（如 365 天）会逐日拉取，留足余量避免误判执行中的任务
    running-timeout: 60m
    cleanup-interval: 5m
    cleanup-initial-delay: 1m
    # 每日定时同步：默认每天上午 9:00 触发
    daily-cron: 0 0 9 * * *
    # 回溯 3 天而非 1 天：任务在早上 9:00 执行，只拉当天会漏掉前一晚的骑行与
    # Garmin 的数据延迟修正。同步按唯一键覆盖写入，重叠区间不会产生重复数据。
    daily-days: 3
    zone: Asia/Shanghai
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt-secret: ${JWT_SECRET:}
    issuer: training-plan-server
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    token-cipher-key: ${TOKEN_CIPHER_KEY:}
  collector:
    base-url: ${COLLECTOR_BASE_URL:http://127.0.0.1:8090}
    service-token: ${COLLECTOR_SERVICE_TOKEN:}
    # Garmin 国际站登录实测约 30 秒（库内部会依次尝试多段登录策略），
    # 超时必须显著大于该值，否则会把"Garmin 慢"误报成"采集服务不可用"。
    timeout: 120s
