server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: training-plan-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt-secret: ${JWT_SECRET:}
    issuer: training-plan-server
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    token-cipher-key: ${TOKEN_CIPHER_KEY:}
  collector:
    base-url: ${COLLECTOR_BASE_URL:http://127.0.0.1:8090}
    service-token: ${COLLECTOR_SERVICE_TOKEN:}
    timeout: 30s
